<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lập phiếu trả hàng xuất - Quản lý Kho &amp; Công nợ</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="app-content">
      <p class="page-eyebrow">Kho</p>
      <div class="page-header">
        <div class="page-title-group">
          <div>
            <a href="stock-returns.html" class="form-page-back-link" id="back-link"></a>
            <h2 id="page-title">Lập phiếu trả hàng xuất</h2>
          </div>
        </div>
      </div>

      <div id="return-form-error" class="alert alert-error" hidden>
        <span class="alert-icon-slot"></span>
        <span id="return-form-error-text"></span>
      </div>

      <form id="return-form" class="form-page-grid">
        <div class="form-page-main">
          <div class="combobox form-page-search">
            <input type="text" id="quick-add-search" placeholder="Tìm sản phẩm theo mã hoặc tên để thêm vào phiếu trả..." autocomplete="off" />
            <div class="combobox-suggestions" id="quick-add-suggestions"></div>
          </div>

          <div class="item-rows-header">
            <span>Sản phẩm</span>
            <span>ĐVT</span>
            <span>Đã xuất</span>
            <span>SL trả lại</span>
            <span>Giá bán</span>
            <span>Thành tiền</span>
            <span></span>
          </div>
          <div class="item-rows" id="item-rows"></div>
        </div>

        <aside class="form-page-side">
        <div class="form-page-side-scroll">
          <div class="form-field">
            <label for="return-partner">Khách hàng</label>
            <select id="return-partner"></select>
          </div>

          <div id="new-partner-fields" class="form-field" hidden>
            <label>Khách hàng mới</label>
            <div class="new-partner-inputs">
              <input type="text" id="new-partner-name" placeholder="Tên khách hàng" />
              <input type="text" id="new-partner-phone" placeholder="Số điện thoại (không bắt buộc)" />
              <input type="text" id="new-partner-address" placeholder="Địa chỉ (không bắt buộc)" />
            </div>
          </div>

          <div class="form-field">
            <label for="return-date">Thời gian trả</label>
            <input type="datetime-local" id="return-date" />
          </div>

          <div class="form-field">
            <label for="return-project">Công trình (không bắt buộc)</label>
            <select id="return-project">
              <option value="">-- Không gắn công trình --</option>
            </select>
          </div>

          <div class="form-field">
            <label for="return-note">Ghi chú</label>
            <input type="text" id="return-note" placeholder="vd: Khách trả hàng lỗi" autocomplete="off" />
          </div>
        </div>
        <div class="form-page-side-footer">
          <div class="receipt-total-row">
            <span>Tổng tiền giảm công nợ</span>
            <span id="return-total-amount">0</span>
          </div>

          <div class="form-page-side-actions form-page-side-actions-stacked">
            <div class="form-page-side-actions">
              <button type="button" id="btn-cancel-return" class="btn-secondary">Hủy</button>
              <button type="button" id="btn-save-draft" class="btn-secondary">Lưu</button>
            </div>
            <button type="button" id="btn-process-return" class="btn-primary">Trừ kho</button>
          </div>
        </div>
        </aside>
      </form>
    </main>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/money-input.js"></script>
  <script src="assets/stock-return-form.js"></script>
</body>
</html>
