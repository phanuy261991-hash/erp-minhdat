<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhập kho - Quản lý Kho &amp; Công nợ</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="app-content">
      <p class="page-eyebrow">Kho</p>
      <div class="page-header">
        <h2>Nhập kho</h2>
        <button type="button" id="btn-add-receipt" class="btn-add"></button>
      </div>

      <div id="receipts-error" class="alert alert-error" hidden>
        <span class="alert-icon-slot"></span>
        <span id="receipts-error-text"></span>
      </div>

      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã phiếu</th>
              <th>Nhà cung cấp</th>
              <th>Người lập</th>
              <th>Ghi chú</th>
              <th>Ngày lập</th>
            </tr>
          </thead>
          <tbody id="receipts-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="receipt-modal" class="modal-overlay" hidden>
    <div class="modal-card modal-card-lg">
      <h3>Lập phiếu nhập kho</h3>
      <form id="receipt-form">
        <div id="receipt-form-error" class="alert alert-error" hidden>
          <span class="alert-icon-slot"></span>
          <span id="receipt-form-error-text"></span>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="receipt-partner">Nhà cung cấp</label>
            <select id="receipt-partner"></select>
          </div>
          <div class="form-field">
            <label for="receipt-date">Thời gian nhập</label>
            <input type="datetime-local" id="receipt-date" />
          </div>
        </div>

        <div id="new-partner-fields" class="form-field" hidden>
          <label>Nhà cung cấp mới</label>
          <div class="new-partner-inputs">
            <input type="text" id="new-partner-name" placeholder="Tên nhà cung cấp" />
            <input type="text" id="new-partner-phone" placeholder="Số điện thoại (không bắt buộc)" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="receipt-order-code">Mã đơn hàng</label>
            <input type="text" id="receipt-order-code" placeholder="Số hóa đơn/đơn hàng của NCC (không bắt buộc)" autocomplete="off" />
          </div>
          <div class="form-field">
            <label for="receipt-note">Ghi chú</label>
            <input type="text" id="receipt-note" placeholder="vd: Nhập tồn đầu kỳ" autocomplete="off" />
          </div>
        </div>

        <div class="form-field">
          <label>Danh sách sản phẩm</label>
          <div class="item-rows-header">
            <span>Sản phẩm</span>
            <span>ĐVT</span>
            <span>Số lượng</span>
            <span>Đơn giá</span>
            <span>Chiết khấu (%)</span>
            <span>Thành tiền</span>
            <span></span>
          </div>
          <div class="item-rows" id="item-rows"></div>
          <button type="button" id="btn-add-item-row" class="btn-secondary btn-add-row">+ Thêm dòng</button>
          <div class="receipt-total-row">
            <span>Tổng thành tiền</span>
            <span id="receipt-total-amount">0</span>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel-receipt" class="btn-secondary">Hủy</button>
          <button type="submit" id="btn-submit-receipt" class="btn-primary">Lưu phiếu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/stock-receipts.js"></script>
</body>
</html>
