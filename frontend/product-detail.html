<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sản phẩm - Quản lý Kho &amp; Công nợ</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="app-content">
      <p class="page-eyebrow">Kho</p>
      <div class="page-header">
        <div class="page-title-group">
          <a href="products.html" id="btn-back" class="icon-btn" title="Quay lại danh sách sản phẩm"></a>
          <h2 id="product-name">Chi tiết sản phẩm</h2>
        </div>
      </div>

      <div id="detail-error" class="alert alert-error" hidden>
        <span class="alert-icon-slot"></span>
        <span id="detail-error-text"></span>
      </div>

      <div class="stat-grid" id="stat-grid"></div>

      <h3 class="section-heading">Lịch sử nhập/xuất kho</h3>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Ngày</th>
              <th>Loại</th>
              <th>Số lượng</th>
              <th>Giá vốn</th>
              <th>Mã phiếu</th>
            </tr>
          </thead>
          <tbody id="movements-tbody"></tbody>
        </table>
      </div>

      <h3 class="section-heading">Lịch sử chỉnh sửa thông tin</h3>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Ngày</th>
              <th>Người sửa</th>
              <th>Trường</th>
              <th>Giá trị cũ</th>
              <th>Giá trị mới</th>
            </tr>
          </thead>
          <tbody id="history-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/product-detail.js"></script>
</body>
</html>
