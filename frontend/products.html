<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sản phẩm - Quản lý Kho &amp; Công nợ</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="app-content">
      <p class="page-eyebrow">Kho</p>
      <div class="page-header">
        <h2>Sản phẩm</h2>
        <div class="page-header-actions">
          <div class="search-box">
            <span class="input-icon"></span>
            <input type="text" id="product-search" class="search-input" placeholder="Tìm theo mã hoặc tên..." autocomplete="off" />
          </div>
          <button type="button" id="btn-add-product" class="btn-add"></button>
        </div>
      </div>

      <div id="products-error" class="alert alert-error" hidden>
        <span class="alert-icon-slot"></span>
        <span id="products-error-text"></span>
      </div>

      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã</th>
              <th>Tên sản phẩm</th>
              <th>Đơn vị tính</th>
              <th>Giá vốn</th>
              <th>Giá bán</th>
              <th id="th-stock" class="sortable-th">Tồn kho <span class="sort-icon"></span></th>
              <th>Trạng thái</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="products-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="product-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <h3 id="product-modal-title">Thêm sản phẩm mới</h3>
      <form id="product-form">
        <div id="product-form-error" class="alert alert-error" hidden>
          <span class="alert-icon-slot"></span>
          <span id="product-form-error-text"></span>
        </div>

        <div class="form-field">
          <label for="product-code">Mã sản phẩm</label>
          <input type="text" id="product-code" required autocomplete="off" />
        </div>

        <div class="form-field">
          <label for="product-name">Tên sản phẩm</label>
          <input type="text" id="product-name" required autocomplete="off" />
        </div>

        <div class="form-field">
          <label for="product-unit">Đơn vị tính</label>
          <input type="text" id="product-unit" required autocomplete="off" placeholder="vd: cái, kg, thùng" />
        </div>

        <div class="form-field">
          <label for="product-sale-price">Giá bán</label>
          <input type="number" id="product-sale-price" required min="0" step="1000" />
        </div>

        <div class="form-field">
          <label for="product-cost-price">Giá vốn</label>
          <input type="number" id="product-cost-price" min="0" step="1000" />
        </div>

        <div class="form-field">
          <label for="product-low-stock-threshold">Ngưỡng cảnh báo tồn kho thấp</label>
          <input type="number" id="product-low-stock-threshold" min="0" step="1" />
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel-product" class="btn-secondary">Hủy</button>
          <button type="submit" id="btn-submit-product" class="btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/products.js"></script>
</body>
</html>
