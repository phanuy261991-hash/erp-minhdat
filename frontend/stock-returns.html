<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trả hàng - Quản lý Kho &amp; Công nợ</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="app-content">
      <p class="page-eyebrow">Kho</p>
      <div class="page-header">
        <h2>Trả hàng</h2>
        <div class="page-header-actions">
          <div class="search-box">
            <span class="input-icon"></span>
            <input type="text" id="return-search" class="search-input" placeholder="Tìm theo mã phiếu, tên hoặc số điện thoại..." autocomplete="off" />
          </div>
          <div class="action-dropdown" id="return-type-dropdown">
            <button type="button" id="btn-add-return" class="btn-add"></button>
            <div class="action-dropdown-menu" id="return-type-menu" hidden>
              <button type="button" class="action-dropdown-item" id="btn-choose-customer-return"></button>
              <button type="button" class="action-dropdown-item" id="btn-choose-supplier-return"></button>
            </div>
          </div>
        </div>
      </div>

      <div id="returns-error" class="alert alert-error" hidden>
        <span class="alert-icon-slot"></span>
        <span id="returns-error-text"></span>
      </div>

      <div class="data-table-wrap data-table-wrap--fill">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã phiếu</th>
              <th>Loại</th>
              <th>Đối tác</th>
              <th>Số điện thoại</th>
              <th>Công trình</th>
              <th>Người lập</th>
              <th>Ngày lập</th>
              <th>Số tiền giảm nợ</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="returns-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="return-detail-modal" class="modal-overlay" hidden>
    <div class="modal-card modal-card-lg">
      <h3>Chi tiết phiếu trả hàng</h3>
      <div id="return-detail-error" class="alert alert-error" hidden>
        <span class="alert-icon-slot"></span>
        <span id="return-detail-error-text"></span>
      </div>
      <div class="detail-info-grid" id="return-detail-info"></div>
      <h4 class="section-heading">Danh sách hàng trả</h4>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>ĐVT</th>
              <th>Số lượng trả lại</th>
              <th>Đơn giá</th>
              <th>Thành tiền</th>
            </tr>
          </thead>
          <tbody id="return-detail-items"></tbody>
        </table>
      </div>
      <div class="receipt-total-row">
        <span>Tổng tiền giảm công nợ</span>
        <span id="return-detail-total">0</span>
      </div>
      <div class="modal-actions">
        <button type="button" id="btn-close-return-detail" class="btn-secondary">Đóng</button>
      </div>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/stock-returns.js"></script>
</body>
</html>
